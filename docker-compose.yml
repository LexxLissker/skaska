# Локальная разработка: postgres + API + воркер + витрина.
# Продакшен — в docker-compose.prod.yml.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-vendure}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-vendure}
      POSTGRES_DB: ${DB_NAME:-zamorozka}
    ports:
      # Наружу — чтобы подключаться psql или DBeaver с хоста.
      - '5432:5432'
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-vendure} -d ${DB_NAME:-zamorozka}']
      interval: 5s
      timeout: 5s
      retries: 10

  api: &api
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    restart: unless-stopped
    command: npm run dev:server --workspace=@zamorozka/api
    depends_on:
      db:
        condition: service_healthy
    environment: &api_env
      APP_ENV: dev
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-zamorozka}
      DB_USERNAME: ${DB_USERNAME:-vendure}
      DB_PASSWORD: ${DB_PASSWORD:-vendure}
      PORT: 3000
      SUPERADMIN_USERNAME: ${SUPERADMIN_USERNAME:-superadmin}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:-superadmin}
      COOKIE_SECRET: ${COOKIE_SECRET:-zamorozka-dev-cookie-secret}
      CORS_ORIGIN: http://localhost:3001
      STOREFRONT_URL: http://localhost:3001
    ports:
      - '3000:3000'
      - '3002:3002'
    volumes:
      - ./apps/api/src:/app/apps/api/src
      - api_static:/app/apps/api/static

  worker:
    <<: *api
    command: npm run dev:worker --workspace=@zamorozka/api
    environment:
      <<: *api_env
    ports: []

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    restart: unless-stopped
    depends_on:
      - api
    environment:
      # В браузере адрес API внешний, при серверном рендеринге — внутри сети.
      NEXT_PUBLIC_SHOP_API_URL: http://localhost:3000/shop-api
      SHOP_API_URL_INTERNAL: http://api:3000/shop-api
      NEXT_PUBLIC_PHONE_LOGIN_ENABLED: 'false'
      NEXT_PUBLIC_USE_VENDURE: 'true'
    ports:
      - '3001:3001'
    volumes:
      - ./apps/web/app:/app/apps/web/app
      - ./apps/web/components:/app/apps/web/components
      - ./apps/web/lib:/app/apps/web/lib

volumes:
  db_data:
  api_static:
