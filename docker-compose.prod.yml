services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Leave empty until the Vendure Shop API is deployed separately.
      NEXT_PUBLIC_VENDURE_API_URL: ${NEXT_PUBLIC_VENDURE_API_URL:-}
      NEXT_PUBLIC_VENDURE_CUSTOM_OPTIONS: ${NEXT_PUBLIC_VENDURE_CUSTOM_OPTIONS:-false}
    networks:
      - storefront

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - storefront

networks:
  storefront:

volumes:
  caddy_data:
  caddy_config:
