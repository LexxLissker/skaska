# Продакшен на VPS. Образы собираются прямо на сервере — registry не нужен.
# TLS-сертификаты Caddy получает и продлевает сам.
#
# Запуск с ноутбука: DEPLOY_HOST=deploy@СЕРВЕР ./deploy.sh
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:?требуется DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?требуется DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:?требуется DB_NAME}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME} -d ${DB_NAME}']
      interval: 10s
      timeout: 5s
      retries: 5
    # Наружу порт не публикуем: база доступна только внутри docker-сети.
    networks: [internal]

  api: &api
    image: zamorozka-api:local
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: production
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment: &api_env
      APP_ENV: production
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      PORT: 3000
      SUPERADMIN_USERNAME: ${SUPERADMIN_USERNAME:?требуется SUPERADMIN_USERNAME}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:?требуется SUPERADMIN_PASSWORD}
      COOKIE_SECRET: ${COOKIE_SECRET:?требуется COOKIE_SECRET}
      CORS_ORIGIN: ${PUBLIC_URL:?требуется PUBLIC_URL}
      STOREFRONT_URL: ${PUBLIC_URL}
      ASSET_URL_PREFIX: ${PUBLIC_URL}/assets/
    volumes:
      - api_static:/app/apps/api/static
    networks: [internal]

  worker:
    <<: *api
    command: ['node', 'apps/api/dist/index-worker.js']
    environment:
      <<: *api_env
    volumes:
      - api_static:/app/apps/api/static
    healthcheck:
      disable: true

  web:
    image: zamorozka-web:local
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: production
      args:
        NEXT_PUBLIC_SHOP_API_URL: ${PUBLIC_URL}/shop-api
        NEXT_PUBLIC_USE_VENDURE: 'true'
    restart: unless-stopped
    depends_on: [api]
    environment:
      NODE_ENV: production
      # Серверный рендеринг ходит в API внутри сети, минуя интернет.
      SHOP_API_URL_INTERNAL: http://api:3000/shop-api
      NEXT_PUBLIC_SHOP_API_URL: ${PUBLIC_URL}/shop-api
      NEXT_PUBLIC_USE_VENDURE: 'true'
    networks: [internal]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [web, api]
    ports:
      - '80:80'
      - '443:443'
    environment:
      PUBLIC_URL: ${PUBLIC_URL}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [internal]

volumes:
  db_data:
  api_static:
  caddy_data:
  caddy_config:

networks:
  internal:
