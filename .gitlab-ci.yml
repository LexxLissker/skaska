# Конвейер: проверка → сборка образов → деплой.
#
# Деплой выключен (when: manual) до появления сервера. Чтобы включить,
# заведите переменные CI: SSH_PRIVATE_KEY, DEPLOY_HOST, DEPLOY_USER, DOMAIN.

stages:
  - check
  - build
  - deploy

variables:
  IMAGE_API: $CI_REGISTRY_IMAGE/api
  IMAGE_WEB: $CI_REGISTRY_IMAGE/web
  # Тег образа — короткий SHA коммита: всегда понятно, что именно развёрнуто.
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA

default:
  interruptible: true

# ─── Проверка ─────────────────────────────────────────────────────────────────
typecheck:
  stage: check
  image: node:24-bookworm-slim
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run typecheck
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH

# ─── Сборка образов ───────────────────────────────────────────────────────────
.docker_build:
  stage: build
  image: docker:29-cli
  services:
    - docker:29-dind
  variables:
    DOCKER_TLS_CERTDIR: '/certs'
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

build:api:
  extends: .docker_build
  script:
    # Кэш из предыдущего образа сильно ускоряет пересборку слоя с npm ci.
    - docker pull "$IMAGE_API:latest" || true
    - >
      docker build
      --file apps/api/Dockerfile
      --target production
      --cache-from "$IMAGE_API:latest"
      --build-arg BUILDKIT_INLINE_CACHE=1
      --tag "$IMAGE_API:$IMAGE_TAG"
      --tag "$IMAGE_API:latest"
      .
    - docker push "$IMAGE_API:$IMAGE_TAG"
    - docker push "$IMAGE_API:latest"

build:web:
  extends: .docker_build
  script:
    - docker pull "$IMAGE_WEB:latest" || true
    - >
      docker build
      --file apps/web/Dockerfile
      --target production
      --cache-from "$IMAGE_WEB:latest"
      --build-arg BUILDKIT_INLINE_CACHE=1
      --build-arg NEXT_PUBLIC_SHOP_API_URL="https://$DOMAIN/shop-api"
      --tag "$IMAGE_WEB:$IMAGE_TAG"
      --tag "$IMAGE_WEB:latest"
      .
    - docker push "$IMAGE_WEB:$IMAGE_TAG"
    - docker push "$IMAGE_WEB:latest"

# ─── Деплой ───────────────────────────────────────────────────────────────────
deploy:production:
  stage: deploy
  image: alpine:3.21
  environment:
    name: production
    url: https://$DOMAIN
  before_script:
    - apk add --no-cache openssh-client rsync
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    # Отпечаток хоста берём из переменной CI, а не через ssh-keyscan:
    # keyscan доверяет тому, что ответит сеть, и не защищает от подмены.
    - echo "$DEPLOY_HOST_KEY" > ~/.ssh/known_hosts && chmod 644 ~/.ssh/known_hosts
  script:
    - rsync -az docker-compose.prod.yml deploy/ "$DEPLOY_USER@$DEPLOY_HOST:/opt/zamorozka/"
    - |
      ssh "$DEPLOY_USER@$DEPLOY_HOST" bash -s <<EOF
        set -euo pipefail
        cd /opt/zamorozka
        export REGISTRY_IMAGE_API="$IMAGE_API:$IMAGE_TAG"
        export REGISTRY_IMAGE_WEB="$IMAGE_WEB:$IMAGE_TAG"
        echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
        docker compose -f docker-compose.prod.yml pull
        docker compose -f docker-compose.prod.yml up -d --remove-orphans
        docker image prune -f
      EOF
  rules:
    # Пока сервера нет — только по кнопке. После настройки VPS
    # можно убрать `when: manual`, чтобы деплой шёл автоматически.
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
